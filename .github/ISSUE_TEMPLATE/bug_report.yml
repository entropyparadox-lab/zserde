name: "🐛 Bug Report"
description: "File an issue for a bug or unexpected behavior in zserde"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please ensure you have tested against the latest development version of `zserde` and Zig 0.17.0-dev.
  - type: input
    id: version
    attributes:
      label: "Zig & zserde Version"
      description: "Run `zig version` and provide your zserde version"
      placeholder: "Zig: 0.17.0-dev.2085+5e36170b5, zserde: main"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: "Describe the bug"
      description: "A clear and concise description of what happened."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Minimal Reproducible Example"
      description: "Please provide a self-contained minimal Zig code snippet demonstrating the bug."
      render: zig
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen instead?"
    validations:
      required: true
